<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-labelledby="title desc"><title id="title">HTTP request and response</title><desc id="desc">A browser sends an HTTP request to a server and receives a response</desc><rect width="900" height="250" rx="18" fill="#eef5fb"/><rect x="25" y="65" width="230" height="120" rx="15" fill="#0b1f3a"/><rect x="645" y="65" width="230" height="120" rx="15" fill="#0b1f3a"/><g font-family="Arial,sans-serif" font-size="27" fill="white" text-anchor="middle"><text x="140" y="135">Browser</text><text x="760" y="135">Web Server</text></g><g font-family="Arial,sans-serif" font-size="21" fill="#0b1f3a" text-anchor="middle"><text x="450" y="50">HTTP Request →</text><text x="450" y="213">← HTTP Response</text></g><path d="M275 88 H620 l-18 -12 m18 12 -18 12" fill="none" stroke="#1769aa" stroke-width="6"/><path d="M625 163 H280 l18 -12 m-18 12 18 12" fill="none" stroke="#1769aa" stroke-width="6"/></svg>